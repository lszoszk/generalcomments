name: Public files

# This repository publishes the site only. Fail when a commit adds a file
# outside PUBLIC_FILES, or any Python other than the page build, so pipeline
# code or source data cannot slip in by accident.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  allowlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files against PUBLIC_FILES
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          rules = [l.strip() for l in open('PUBLIC_FILES') if l.strip() and not l.lstrip().startswith('#')]
          def allowed(path):
              for rule in rules:
                  if rule.endswith('/'):
                      if path.startswith(rule):
                          return True
                  elif re.fullmatch(re.escape(rule).replace(r'\*', '[^/]*'), path):
                      return True
              return False
          files = [f for f in subprocess.run(['git', 'ls-files'], capture_output=True, text=True, check=True).stdout.splitlines() if f]
          bad = [f for f in files if not allowed(f)]
          bad += [f for f in files if f.endswith('.py') and f != 'build_static_pages.py' and f not in bad]
          if bad:
              print('Not allowed in the public site repository (see PUBLIC_FILES):')
              print('\n'.join('  ' + f for f in bad))
              sys.exit(1)
          print(f'{len(files)} tracked files, all allowed.')
          PY
